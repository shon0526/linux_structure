services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: linux-structure-dev
    container_name: linux-structure-dev
    # リポジトリをコンテナ内の /workspace にマウントして永続化
    volumes:
      - ./:/workspace
      # ダウンロードした crate をキャッシュして、コンテナ再作成後も再取得しない
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
    working_dir: /workspace
    tty: true
    stdin_open: true

volumes:
  cargo-registry:
  cargo-git:
